<!DOCTYPE html>
<html>
    <head>
        <script>
            function removeChordsAndSpaces() {
                var song = document.getElementById('origin').value;
                cleanLyrics=song.replace(/\[[^\]]+\]/g, '').split('\n').map(line => line.trim()).map(line => line.replace(/\s+/g, ' ')).join('\n').replace(/\n{2,}/g, '\n');
                document.getElementById('final').innerHTML = cleanLyrics;
            }
        </script>
        <style>
            textarea{
                min-box:100px;
                max-box:1000px;
            }
        </style>
    </head>
    <body>
        <textarea id="origin"></textarea>
        <button onclick="removeChordsAndSpaces()">Action</button>
        <p id="final"></p>
    </body>
</html>
